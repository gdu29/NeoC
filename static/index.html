<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoC Interface Souveraine</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181f;
            --user-msg: #282836;
            --neoc-msg: #1a2e22;
            --accent-green: #30d158;
            --accent-purple: #bf5af2;
            --text-color: #e5e5ea;
            --text-muted: #8e8e93;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem;
            border-bottom: 1px solid #2c2c3e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1.1rem; color: var(--accent-green); font-weight: 600; }
        header span { font-size: 0.8rem; color: var(--text-muted); }

        #chat-flow {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 85%;
            padding: 0.8rem 1.1rem;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            border-bottom-right-radius: 2px;
        }

        .message.neoc {
            align-self: flex-start;
            background-color: var(--neoc-msg);
            border-left: 3px solid var(--accent-green);
            border-bottom-left-radius: 2px;
        }

        .meta-tag {
            font-size: 0.7rem;
            color: var(--accent-purple);
            margin-bottom: 0.3rem;
            display: block;
            text-transform: uppercase;
        }

        #input-area {
            padding: 1rem;
            background-color: var(--card-bg);
            border-top: 1px solid #2c2c3e;
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid #2c2c3e;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--accent-purple); }

        button {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.8rem 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>⚓ NeoC Core v4.0</h1>
        <span>Souveraineté Locale 🌐</span>
    </header>

    <main id="chat-flow">
        <div class="message neoc">
            <span class="meta-tag">System</span>
            Ancrage réseau établi. Moteur prêt. ⚓🌐♻️
        </div>
    </main>

    <footer id="input-area">
        <input type="text" id="user-input" placeholder="Poser une question..." autocomplete="off">
        <button id="send-btn">Émettre</button>
    </footer>

    <script>
        const chatFlow = document.getElementById('chat-flow');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(role, text, intent = '') {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);

            if (role === 'neoc') {
                const tag = document.createElement('span');
                tag.classList.add('meta-tag');
                tag.textContent = `NeoC (${intent || 'SOUVERAIN'})`;
                msgDiv.appendChild(tag);
            }

            const content = document.createElement('div');
            content.textContent = text;
            msgDiv.appendChild(content);

            chatFlow.appendChild(msgDiv);
            chatFlow.scrollTop = chatFlow.scrollHeight;
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;

            appendMessage('user', query);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                if (response.ok) {
                    appendMessage('neoc', data.response, data.intent);
                } else {
                    appendMessage('neoc', `[Erreur API] : ${data.detail}`);
                }
            } catch (err) {
                appendMessage('neoc', `[-] Échec de liaison avec l'API NeoC : ${err.message}`);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
  </html>
